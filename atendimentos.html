<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldfeder — Consultas</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pipeline { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:2rem; }
    .pipeline-col { background:var(--gray-100); border-radius:var(--radius); padding:1rem; }
    .pipeline-col-title { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:.75rem; }
    .pipeline-card {
      background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius);
      padding:.75rem; margin-bottom:.5rem; cursor:pointer; font-size:.825rem;
      transition:border-color .15s;
    }
    .pipeline-card:hover { border-color:var(--black); }
    .pipeline-card .pet { font-weight:700; }
    .pipeline-card .meta { color:var(--gray-600); font-size:.75rem; margin-top:.2rem; }
  </style>
</head>
<body>
<nav>
  <a class="nav-brand" href="home.html">Goldfeder <span>Cardiologia Vet</span></a>
  <button class="nav-toggle" id="nav-toggle" aria-label="Menu">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="home.html">Dashboard</a>
    <a href="index.html">+ Atendimento</a>
    <a href="pacientes.html">Pacientes</a>
    <a href="atendimentos.html" class="active">Consultas</a>
    <a href="procedimentos.html">Procedimentos</a>
    <a href="tutores.html">Tutores</a>
    <a href="busca.html">Busca</a>
  </div>
</nav>
<main>
  <h1>Consultas e Exames</h1>
  <p class="subtitle">Pipeline de atendimentos da clínica.</p>

  <div id="pipeline-container">
    <div class="pipeline">
      <div class="pipeline-col">
        <div class="pipeline-col-title">🗓 Agendados <span id="cnt-agendado" style="font-weight:400;color:#888"></span></div>
        <div id="col-agendado"></div>
      </div>
      <div class="pipeline-col">
        <div class="pipeline-col-title">✅ Realizados <span id="cnt-realizado" style="font-weight:400;color:#888"></span></div>
        <div id="col-realizado"></div>
      </div>
      <div class="pipeline-col">
        <div class="pipeline-col-title">❌ Cancelados <span id="cnt-cancelado" style="font-weight:400;color:#888"></span></div>
        <div id="col-cancelado"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Todos os Atendimentos</span>
    </div>
    <div class="filters" style="margin-bottom:1rem">
      <input type="text" id="busca" placeholder="Pet, tutor, tipo...">
      <select id="filtro-status">
        <option value="">Todos</option>
        <option value="agendado">Agendado</option>
        <option value="realizado">Realizado</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <input type="month" id="filtro-mes" title="Filtrar por mês">
      <button class="btn btn-outline btn-sm" id="btn-limpar">Limpar</button>
    </div>
    <div id="lista-container"><div class="empty-state"><p>Carregando...</p></div></div>
  </div>
</main>
<div id="toast"></div>

<!-- Modal edição -->
<div class="modal-overlay" id="modal-at">
  <div class="modal" style="max-width:640px">
    <h3 id="modal-titulo">Atendimento</h3>
    <form id="form-at" novalidate style="margin-top:1rem">
      <div class="form-grid">
        <div class="form-group full" id="info-pac-at" style="background:var(--gray-100);padding:.75rem;border-radius:var(--radius);font-size:.875rem"></div>
        <div class="form-group">
          <label for="m-tipo">Tipo</label>
          <select id="m-tipo">
            <option>Consulta</option><option>Retorno</option>
            <option>Ecocardiograma</option><option>Eletrocardiograma</option>
            <option>Holter</option><option>Radiografia</option><option>Outro exame</option>
          </select>
        </div>
        <div class="form-group">
          <label for="m-data">Data e Hora</label>
          <input type="datetime-local" id="m-data">
        </div>
        <div class="form-group">
          <label for="m-status">Status</label>
          <select id="m-status">
            <option value="agendado">Agendado</option>
            <option value="realizado">Realizado</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>
        <div class="form-group">
          <label for="m-valor">Valor (R$)</label>
          <input type="number" id="m-valor" placeholder="0,00" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label for="m-pag">Pagamento</label>
          <select id="m-pag">
            <option value="">—</option><option>PIX</option><option>Dinheiro</option>
            <option>Cartão de Débito</option><option>Cartão de Crédito</option>
            <option>Parcelado</option><option>Convênio</option>
          </select>
        </div>
        <div class="form-group">
          <label for="m-retorno">Retorno em</label>
          <input type="date" id="m-retorno">
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:.5rem;padding-top:1.5rem">
          <input type="checkbox" id="m-nf" style="width:16px;height:16px;cursor:pointer;accent-color:#000">
          <label for="m-nf" style="margin:0;cursor:pointer;font-weight:500">NF emitida</label>
        </div>
        <div class="form-group full">
          <label for="m-queixa">Queixa principal</label>
          <textarea id="m-queixa"></textarea>
        </div>
        <div class="form-group full">
          <label for="m-diag">Diagnóstico / Achados</label>
          <textarea id="m-diag"></textarea>
        </div>
        <div class="form-group full">
          <label for="m-presc">Prescrição / Conduta</label>
          <textarea id="m-presc"></textarea>
        </div>
        <div class="form-group full">
          <label for="m-obs">Observações</label>
          <textarea id="m-obs"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-danger btn-sm" id="btn-excluir-at" style="margin-right:auto">Excluir</button>
        <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
let todos = [];
let editandoId = null;

// Checa se veio ?id= na URL
const urlId = new URLSearchParams(location.search).get('id');

document.addEventListener('DOMContentLoaded', async () => {
  if (!initSupabase()) return;
  await carregar();
  if (urlId) abrirModal(urlId);

  document.getElementById('busca').addEventListener('input', renderFiltrado);
  document.getElementById('filtro-status').addEventListener('change', renderFiltrado);
  document.getElementById('filtro-mes').addEventListener('change', renderFiltrado);
  document.getElementById('btn-limpar').addEventListener('click', () => {
    document.getElementById('busca').value='';
    document.getElementById('filtro-status').value='';
    document.getElementById('filtro-mes').value='';
    renderFiltrado();
  });
  document.getElementById('form-at').addEventListener('submit', salvar);
  document.getElementById('btn-excluir-at').addEventListener('click', excluir);
});

async function carregar() {
  const {data} = await dbClient.from('atendimentos')
    .select('*,pacientes(nome,especie,raca),tutores(nome,telefone)')
    .order('data_atendimento',{ascending:false});
  todos = data||[];
  renderPipeline();
  renderFiltrado();
}

function renderPipeline() {
  const agora = new Date();
  const proximos = todos.filter(a => a.status==='agendado' && new Date(a.data_atendimento)>=agora).slice(0,5);
  const recentes = todos.filter(a => a.status==='realizado').slice(0,5);
  const cancelados = todos.filter(a => a.status==='cancelado').slice(0,5);

  document.getElementById('cnt-agendado').textContent = `(${todos.filter(a=>a.status==='agendado').length})`;
  document.getElementById('cnt-realizado').textContent = `(${todos.filter(a=>a.status==='realizado').length})`;
  document.getElementById('cnt-cancelado').textContent = `(${todos.filter(a=>a.status==='cancelado').length})`;

  renderCol('col-agendado', proximos);
  renderCol('col-realizado', recentes);
  renderCol('col-cancelado', cancelados);
}

function renderCol(id, rows) {
  const c = document.getElementById(id);
  if (!rows.length) { c.innerHTML='<div style="font-size:.8rem;color:#aaa;padding:.5rem">Nenhum</div>'; return; }
  c.innerHTML = rows.map(r=>`
    <div class="pipeline-card" onclick="abrirModal('${r.id}')">
      <div class="pet">${esc(r.pacientes?.nome||'—')}</div>
      <div class="meta">${esc(r.tipo||'—')} · ${fmtDataHora(r.data_atendimento)}</div>
      <div class="meta">👤 ${esc(r.tutores?.nome||'—')}</div>
    </div>`).join('');
}

function renderFiltrado() {
  const busca = document.getElementById('busca').value.toLowerCase();
  const st = document.getElementById('filtro-status').value;
  const mes = document.getElementById('filtro-mes').value;
  let lista = todos.filter(a => {
    if (st && a.status!==st) return false;
    if (mes && !a.data_atendimento.startsWith(mes)) return false;
    if (busca) {
      const txt=[a.pacientes?.nome,a.tutores?.nome,a.tipo,a.diagnostico].filter(Boolean).join(' ').toLowerCase();
      if (!txt.includes(busca)) return false;
    }
    return true;
  });
  const c = document.getElementById('lista-container');
  if (!lista.length){c.innerHTML='<div class="empty-state"><p>Nenhum atendimento encontrado.</p></div>';return;}
  const rows = lista.map(a=>`
    <tr onclick="abrirModal('${a.id}')" style="cursor:pointer">
      <td>${fmtDataHora(a.data_atendimento)}</td>
      <td><strong>${esc(a.pacientes?.nome||'—')}</strong></td>
      <td>${esc(a.tutores?.nome||'—')}</td>
      <td>${esc(a.tipo||'—')}</td>
      <td>${fmtMoeda(a.valor)}</td>
      <td>${badgeStatus(a.status)}</td>
      <td>${a.nf_emitida ? '<span style="color:#16a34a;font-weight:600;font-size:.8rem">✓ NF</span>' : '<span style="color:#aaa;font-size:.8rem">—</span>'}</td>
    </tr>`).join('');
  c.innerHTML=`<div class="table-wrap"><table>
    <thead><tr><th>Data/Hora</th><th>Paciente</th><th>Tutor</th><th>Tipo</th><th>Valor</th><th>Status</th><th>NF</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function abrirModal(id) {
  editandoId=id;
  const a=todos.find(x=>x.id===id);
  if (!a) return;
  document.getElementById('modal-titulo').textContent = 'Atendimento — '+esc(a.pacientes?.nome||'');
  document.getElementById('info-pac-at').innerHTML=`<strong>${esc(a.pacientes?.nome||'—')}</strong> · ${esc(a.pacientes?.especie||'')} ${esc(a.pacientes?.raca||'')} &nbsp;|&nbsp; 👤 ${esc(a.tutores?.nome||'—')} · ${fmtTelefone(a.tutores?.telefone)}`;
  document.getElementById('m-tipo').value=a.tipo||'Consulta';
  const d=new Date(a.data_atendimento);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  document.getElementById('m-data').value=d.toISOString().slice(0,16);
  document.getElementById('m-status').value=a.status;
  document.getElementById('m-valor').value=a.valor||'';
  document.getElementById('m-pag').value=a.forma_pagamento||'';
  document.getElementById('m-retorno').value=a.retorno_em||'';
  document.getElementById('m-nf').checked=!!a.nf_emitida;
  document.getElementById('m-queixa').value=a.queixa_principal||'';
  document.getElementById('m-diag').value=a.diagnostico||'';
  document.getElementById('m-presc').value=a.prescricao||'';
  document.getElementById('m-obs').value=a.observacoes||'';
  document.getElementById('modal-at').classList.add('open');
}

function fecharModal(){document.getElementById('modal-at').classList.remove('open');}

async function salvar(e) {
  e.preventDefault();
  const {error}=await dbClient.from('atendimentos').update({
    tipo:document.getElementById('m-tipo').value,
    data_atendimento:document.getElementById('m-data').value,
    status:document.getElementById('m-status').value,
    valor:document.getElementById('m-valor').value?Number(document.getElementById('m-valor').value):null,
    forma_pagamento:document.getElementById('m-pag').value||null,
    retorno_em:document.getElementById('m-retorno').value||null,
    nf_emitida:document.getElementById('m-nf').checked,
    queixa_principal:document.getElementById('m-queixa').value||null,
    diagnostico:document.getElementById('m-diag').value||null,
    prescricao:document.getElementById('m-presc').value||null,
    observacoes:document.getElementById('m-obs').value||null,
    updated_at:new Date().toISOString(),
  }).eq('id',editandoId);
  if (error){toast('Erro: '+error.message,'error');return;}
  toast('Atendimento atualizado!');
  fecharModal(); await carregar();
}

async function excluir(){
  if(!confirm('Excluir este atendimento?'))return;
  await dbClient.from('atendimentos').delete().eq('id',editandoId);
  toast('Atendimento removido.'); fecharModal(); await carregar();
}
</script>
</body>
</html>
