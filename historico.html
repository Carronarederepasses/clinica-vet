<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Vet — Histórico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">Clínica Vet <span>Cirurgias</span></a>
  <div class="nav-links">
    <a href="index.html">Dashboard</a>
    <a href="registro.html">+ Registro</a>
    <a href="historico.html" class="active">Histórico</a>
  </div>
</nav>

<main>
  <h1>Histórico de Cirurgias</h1>
  <p class="subtitle">Todas as cirurgias registradas.</p>

  <div class="filters">
    <input type="text" id="busca" placeholder="Buscar pet, proprietário..." style="max-width:220px">
    <select id="filtro-status">
      <option value="">Todos os status</option>
      <option value="agendada">Agendada</option>
      <option value="realizada">Realizada</option>
      <option value="cancelada">Cancelada</option>
    </select>
    <select id="filtro-especie">
      <option value="">Todas as espécies</option>
      <option>Cachorro</option>
      <option>Gato</option>
      <option>Ave</option>
      <option>Coelho</option>
      <option>Réptil</option>
      <option>Outro</option>
    </select>
    <input type="month" id="filtro-mes" title="Filtrar por mês">
    <button class="btn btn-outline btn-sm" id="btn-limpar">Limpar</button>
    <a href="registro.html" class="btn btn-primary btn-sm" style="margin-left:auto">+ Nova cirurgia</a>
  </div>

  <div id="resumo-filtro" style="font-size:.85rem;color:#666;margin-bottom:.75rem;display:none"></div>

  <div class="section">
    <div id="lista-container">
      <div class="empty-state"><p>Carregando...</p></div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
let todos = [];

document.addEventListener('DOMContentLoaded', async () => {
  if (!initSupabase()) {
    document.getElementById('lista-container').innerHTML = '<div class="empty-state"><p>Configure o Supabase em js/config.js.</p></div>';
    return;
  }

  await carregar();

  document.getElementById('busca').addEventListener('input', renderFiltrado);
  document.getElementById('filtro-status').addEventListener('change', renderFiltrado);
  document.getElementById('filtro-especie').addEventListener('change', renderFiltrado);
  document.getElementById('filtro-mes').addEventListener('change', renderFiltrado);
  document.getElementById('btn-limpar').addEventListener('click', () => {
    document.getElementById('busca').value = '';
    document.getElementById('filtro-status').value = '';
    document.getElementById('filtro-especie').value = '';
    document.getElementById('filtro-mes').value = '';
    renderFiltrado();
  });
});

async function carregar() {
  const { data, error } = await dbClient
    .from('cirurgias')
    .select('*')
    .order('data_cirurgia', { ascending: false });

  if (error) {
    document.getElementById('lista-container').innerHTML = '<div class="empty-state"><p>Erro ao carregar dados.</p></div>';
    toast('Erro: ' + error.message, 'error');
    return;
  }

  todos = data || [];
  renderFiltrado();
}

function renderFiltrado() {
  const busca = document.getElementById('busca').value.toLowerCase();
  const status = document.getElementById('filtro-status').value;
  const especie = document.getElementById('filtro-especie').value;
  const mes = document.getElementById('filtro-mes').value; // "YYYY-MM"

  let lista = todos.filter(r => {
    if (status && r.status !== status) return false;
    if (especie && r.especie !== especie) return false;
    if (mes && r.data_cirurgia) {
      const rm = r.data_cirurgia.slice(0, 7);
      if (rm !== mes) return false;
    }
    if (busca) {
      const texto = [r.nome_pet, r.nome_proprietario, r.raca, r.tipo_cirurgia, r.contato]
        .filter(Boolean).join(' ').toLowerCase();
      if (!texto.includes(busca)) return false;
    }
    return true;
  });

  const resumo = document.getElementById('resumo-filtro');
  const temFiltro = busca || status || especie || mes;
  if (temFiltro) {
    const rec = lista.filter(r => r.status === 'realizada').reduce((s, r) => s + (Number(r.valor) || 0), 0);
    resumo.textContent = `${lista.length} registro(s) encontrado(s) — receita filtrada: ${fmtMoeda(rec)}`;
    resumo.style.display = 'block';
  } else {
    resumo.style.display = 'none';
  }

  const cont = document.getElementById('lista-container');
  if (lista.length === 0) {
    cont.innerHTML = '<div class="empty-state"><p>Nenhuma cirurgia encontrada.</p></div>';
    return;
  }

  const rows = lista.map(r => `
    <tr onclick="location.href='registro.html?id=${r.id}'" style="cursor:pointer" title="Clique para editar">
      <td>${fmtData(r.data_cirurgia)}</td>
      <td><strong>${esc(r.nome_pet)}</strong></td>
      <td>${esc(r.especie || '—')}</td>
      <td>${esc(r.raca || '—')}</td>
      <td>${esc(r.tipo_cirurgia || '—')}</td>
      <td>${esc(r.nome_proprietario || '—')}</td>
      <td>${r.contato ? formatarContato(r.contato) : '—'}</td>
      <td>${fmtMoeda(r.valor)}</td>
      <td>${esc(r.forma_pagamento || '—')}</td>
      <td><span class="badge badge-${r.status}">${r.status}</span></td>
    </tr>
  `).join('');

  cont.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Pet</th>
            <th>Espécie</th>
            <th>Raça</th>
            <th>Cirurgia</th>
            <th>Proprietário</th>
            <th>Contato</th>
            <th>Valor</th>
            <th>Pagamento</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatarContato(c) {
  c = String(c).replace(/\D/g, '');
  if (c.length === 11) return `(${c.slice(0,2)}) ${c.slice(2,7)}-${c.slice(7)}`;
  if (c.length === 10) return `(${c.slice(0,2)}) ${c.slice(2,6)}-${c.slice(6)}`;
  return c;
}
</script>
</body>
</html>
